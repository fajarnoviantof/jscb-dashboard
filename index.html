<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSCB Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">JSCB</div>
    <div class="subtitle">JPCB A + JPCB B</div>
    <div id="clock" class="clock">-</div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-page="board">JSCB</button>
    <button class="nav-btn" data-page="notifications">NOTIFIKASI <span id="notifBadge">0</span></button>
    <button id="refreshBtn" class="refresh">↻ Refresh</button>
  </nav>

  <section class="toolbar">
    <input id="searchInput" type="search" placeholder="Cari WO / nopol / kendaraan...">
    <div class="filters">
      <button class="filter active" data-filter="ALL">ALL</button>
      <button class="filter" data-filter="JPCB A">JPCB A</button>
      <button class="filter" data-filter="JPCB B">JPCB B</button>
    </div>
  </section>

  <main>
    <section id="boardPage" class="page active">
      <div class="summary">
        <div><span>TOTAL UNIT</span><b id="totalUnit">0</b></div>
        <div><span>JPCB A</span><b id="totalA">0</b></div>
        <div><span>JPCB B</span><b id="totalB">0</b></div>
        <div><span>NOTIFIKASI</span><b id="totalNotif">0</b></div>
      </div>

      <div id="status" class="status">Memuat data...</div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
    </section>

    <section id="notificationsPage" class="page">
      <div class="notif-head">
        <h2>NOTIFIKASI</h2>
        <button id="refreshNotifBtn" class="refresh small">↻ Refresh</button>
      </div>
      <div id="notifications" class="notifications"></div>
    </section>
  </main>

  <footer>Data terakhir diperbarui <span id="updatedAt">-</span></footer>

  <script src="app.js"></script>
</body>
</html>
