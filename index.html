<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JSCB Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <div class="brand-title">JSCB</div>
      <div class="brand-subtitle">
        JPCB A + JPCB B
      </div>
    </div>

    <div class="clock" id="clock">
      --:--:--
    </div>

  </header>


  <main class="container">

    <!-- NAVIGATION -->

    <div class="tabs">

      <button
        class="tab active"
        data-page="board"
      >
        JSCB
      </button>

      <button
        class="tab"
        data-page="notifications"
      >
        NOTIFIKASI
        <span
          id="notificationBadge"
          class="notification-badge hidden"
        >
          0
        </span>
      </button>

    </div>


    <!-- =========================
         BOARD PAGE
    ========================== -->

    <section
      id="boardPage"
      class="page active"
    >

      <div class="toolbar">

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Cari ID / WO / kendaraan..."
            autocomplete="off"
          >

        </div>


        <div class="filter-group">

          <button
            class="filter-btn active"
            data-filter="ALL"
          >
            ALL
          </button>

          <button
            class="filter-btn"
            data-filter="JPCB A"
          >
            JPCB A
          </button>

          <button
            class="filter-btn"
            data-filter="JPCB B"
          >
            JPCB B
          </button>

        </div>


        <button
          id="refreshBtn"
          class="refresh-btn"
        >
          ↻ Refresh
        </button>

      </div>


      <!-- SUMMARY -->

      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            TOTAL UNIT
          </div>

          <div
            class="summary-value"
            id="totalUnits"
          >
            0
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            JPCB A
          </div>

          <div
            class="summary-value"
            id="totalA"
          >
            0
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            JPCB B
          </div>

          <div
            class="summary-value"
            id="totalB"
          >
            0
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            NOTIFIKASI
          </div>

          <div
            class="summary-value"
            id="totalNotifications"
          >
            0
          </div>

        </div>

      </div>


      <!-- STATUS -->

      <div
        id="status"
        class="status"
      >
        Memuat data...
      </div>


      <!-- TIMELINE -->

      <div class="timeline-wrapper">

        <div
          id="timelineBoard"
          class="timeline-board"
        >

          <!-- dibuat oleh app.js -->

        </div>

      </div>

    </section>


    <!-- =========================
         NOTIFICATION PAGE
    ========================== -->

    <section
      id="notificationsPage"
      class="page"
    >

      <div class="notification-header">

        <div>

          <h2>
            NOTIFIKASI
          </h2>

          <p>
            Data langsung dari sheet NOTIFIKASI
          </p>

        </div>

        <button
          id="refreshNotificationBtn"
          class="refresh-btn"
        >
          ↻ Refresh
        </button>

      </div>


      <div
        id="notificationList"
        class="notification-list"
      >

        <div class="empty">
          Memuat notifikasi...
        </div>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
