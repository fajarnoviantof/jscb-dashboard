<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSCB — Joint Process Control Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">WORKSHOP CONTROL SYSTEM</div>
      <h1>JSCB</h1>
      <p>JPCB A + JPCB B • Timeline Produksi</p>
    </div>
    <div class="top-actions">
      <div id="clock" class="clock">--:--:--</div>
      <button id="refreshBtn" class="btn primary">↻ Refresh</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-page="jscb">JSCB</button>
    <button class="tab" data-page="notification">Notifikasi <span id="notifBadge" class="badge">0</span></button>
  </nav>

  <main>
    <section id="page-jscb" class="page active">
      <div class="toolbar">
        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Cari WO, nopol, kendaraan, SA, proses...">
        </div>
        <div class="filters">
          <button class="filter active" data-group="ALL">SEMUA</button>
          <button class="filter" data-group="A">JPCB A</button>
          <button class="filter" data-group="B">JPCB B</button>
        </div>
        <div id="summary" class="summary">Memuat data...</div>
      </div>

      <div class="board-shell">
        <div id="board" class="timeline-board">
          <div class="loading">Memuat timeline...</div>
        </div>
      </div>
      <div class="scroll-hint">Geser horizontal untuk melihat jam/hari berikutnya • Geser vertikal untuk melihat semua unit</div>
    </section>

    <section id="page-notification" class="page">
      <div class="section-head">
        <div>
          <h2>NOTIFIKASI</h2>
          <p>Sumber data: sheet <strong>NOTIFIKASI</strong></p>
        </div>
        <button id="refreshNotifBtn" class="btn">↻ Refresh</button>
      </div>
      <div id="notifications" class="notification-list">
        <div class="loading">Memuat notifikasi...</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
